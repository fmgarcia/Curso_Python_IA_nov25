# ============================================
# Docker Compose - Sistema de Detección de Tumores
# Configuración para despliegue en Dokploy (Contabo VPS)
# 
# IMPORTANTE: Este archivo se usa desde la raíz del repositorio.
# El proyecto vive en la subcarpeta Proyecto_completo/
# Dokploy debe configurarse con:
#   - Compose Path: ./Proyecto_completo/docker-compose.yml
# ============================================

services:
  # ---- Backend API (FastAPI) ----
  backend:
    build:
      context: ./Proyecto_completo/backend
      dockerfile: Dockerfile
    container_name: detecciontumores-backend
    restart: always
    expose:
      - "8000"
    volumes:
      - backend_weights:/app/weights
      - backend_uploads:/app/uploads
    environment:
      - ENVIRONMENT=production
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---- Frontend (React + Nginx) ----
  frontend:
    build:
      context: ./Proyecto_completo/frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=/api
    container_name: detecciontumores-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

# ---- Volúmenes persistentes ----
volumes:
  backend_weights:
    name: detecciontumores-weights
  backend_uploads:
    name: detecciontumores-uploads

# ---- Red ----
networks:
  dokploy-network:
    external: true
