# ============================================
# GitHub Actions - CI/CD Pipeline
# Despliegue automático a Contabo VPS
# ============================================

name: Deploy to Contabo VPS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---- Job 1: Test ----
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias backend
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest

      - name: Ejecutar tests backend
        run: |
          cd backend
          python -c "from main import app; print('Backend OK')"

  # ---- Job 2: Build y Push ----
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}-backend:latest

      - name: Build y push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}-frontend:latest
          build-args: |
            REACT_APP_API_URL=/api

  # ---- Job 3: Deploy a VPS ----
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Deploy a Contabo VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/tumor-detection
            
            # Actualizar código
            git pull origin main
            
            # Login a GHCR
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Descargar nuevas imágenes
            docker compose pull
            
            # Reiniciar servicios
            docker compose down
            docker compose up -d
            
            # Limpiar imágenes antiguas
            docker image prune -f
            
            echo "✅ Despliegue completado"
