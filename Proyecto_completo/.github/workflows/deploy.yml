# ============================================
# GitHub Actions - CI/CD Pipeline
# Tests + trigger de despliegue en Dokploy
# Repositorio: https://github.com/fmgarcia/Curso_Python_IA_nov25
# Subcarpeta:  Proyecto_completo/
# ============================================

name: CI/CD - Detección de Tumores

on:
  push:
    branches:
      - main
    paths:
      - 'Proyecto_completo/**'
  workflow_dispatch:

jobs:
  # ---- Job 1: Test ----
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias backend
        run: |
          cd Proyecto_completo/backend
          pip install -r requirements.txt

      - name: Verificar backend
        run: |
          cd Proyecto_completo/backend
          python -c "from main import app; print('✅ Backend OK')"

  # ---- Job 2: Notificar a Dokploy ----
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy Webhook
        run: |
          curl -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            --fail --silent --show-error
          echo "✅ Despliegue disparado en Dokploy"
